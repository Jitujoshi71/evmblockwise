[package]
name = "evm-address-extractor"
version = "1.0.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }

reqwest = {
    version = "0.12",
    default-features = false,
    features = ["json", "rustls-tls"]
}

serde_json = "1"
futures = "0.3"
flate2 = "1"
csv = "1"
