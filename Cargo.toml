[package]
name = "evm-blockwise"
version = "2.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }

reqwest = {
    version = "0.12",
    default-features = false,
    features = ["json", "rustls-tls"]
}

serde_json = "1"

futures = "0.3"

flate2 = "1"

csv = "1"
