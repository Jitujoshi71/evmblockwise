```yaml
name: EVM Block Range Address Extractor

on:
  workflow_dispatch:
    inputs:
      chain:
        description: "Select EVM Chain"
        required: true
        default: "bnb"
        type: choice
        options:
          - bnb
          - ethereum
          - polygon
          - arbitrum
          - base
          - optimism
          - avalanche_c

      start_block:
        description: "Start Block Number"
        required: true
        default: "0"
        type: string

      end_block:
        description: "End Block Number"
        required: true
        default: "5000000"
        type: string


jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    permissions:
      contents: write

    steps:

      # ======================================================
      # CHECKOUT
      # ======================================================

      - name: Checkout Repository
        uses: actions/checkout@v4


      # ======================================================
      # RUST
      # ======================================================

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable


      # ======================================================
      # RUST CACHE
      # ======================================================

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2


      # ======================================================
      # GITHUB CLI
      # ======================================================

      - name: Verify GitHub CLI
        run: |
          gh --version


      # ======================================================
      # VALIDATE INPUT
      # ======================================================

      - name: Validate Block Range
        env:
          START_BLOCK: ${{ inputs.start_block }}
          END_BLOCK: ${{ inputs.end_block }}
        run: |
          set -e

          echo "=============================================="
          echo "VALIDATING BLOCK RANGE"
          echo "=============================================="

          echo "Chain       : ${{ inputs.chain }}"
          echo "Start Block : $START_BLOCK"
          echo "End Block   : $END_BLOCK"

          if ! [[ "$START_BLOCK" =~ ^[0-9]+$ ]]; then
            echo "ERROR: start_block must contain only numbers."
            exit 1
          fi

          if ! [[ "$END_BLOCK" =~ ^[0-9]+$ ]]; then
            echo "ERROR: end_block must contain only numbers."
            exit 1
          fi

          if [ "$START_BLOCK" -gt "$END_BLOCK" ]; then
            echo "ERROR: start_block cannot be greater than end_block."
            exit 1
          fi

          TOTAL=$((END_BLOCK - START_BLOCK + 1))

          echo "Total Blocks : $TOTAL"

          echo "=============================================="


      # ======================================================
      # BUILD
      # ======================================================

      - name: Build Release
        run: |
          cargo build --release


      # ======================================================
      # CREATE GITHUB RELEASE
      # ======================================================

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHAIN: ${{ inputs.chain }}
          START_BLOCK: ${{ inputs.start_block }}
          END_BLOCK: ${{ inputs.end_block }}
        run: |
          set -e

          TAG="extract-${CHAIN}-${START_BLOCK}-${END_BLOCK}-$(date +%s)"

          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"

          echo "=============================================="
          echo "CREATING RELEASE"
          echo "=============================================="
          echo "Tag: $TAG"
          echo "=============================================="

          gh release create "$TAG" \
            --title "${CHAIN} blocks ${START_BLOCK}-${END_BLOCK}" \
            --notes "Address extraction for ${CHAIN} blocks ${START_BLOCK} to ${END_BLOCK}."


      # ======================================================
      # RUN EXTRACTOR
      # ======================================================

      - name: Run Extraction
        env:
          TARGET_CHAIN: ${{ inputs.chain }}
          START_BLOCK: ${{ inputs.start_block }}
          END_BLOCK: ${{ inputs.end_block }}
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
          RPC_URL: ${{ secrets.RPC_URL }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e

          echo "=============================================="
          echo "STARTING EXTRACTION"
          echo "=============================================="
          echo "Chain       : $TARGET_CHAIN"
          echo "Start Block : $START_BLOCK"
          echo "End Block   : $END_BLOCK"
          echo "Release     : $RELEASE_TAG"
          echo "=============================================="

          ./target/release/evm-address-extractor \
            --chain "$TARGET_CHAIN" \
            --start-block "$START_BLOCK" \
            --end-block "$END_BLOCK"


      # ======================================================
      # SHOW OUTPUT
      # ======================================================

      - name: List Generated Files
        if: always()
        run: |
          echo "=============================================="
          echo "GENERATED FILES"
          echo "=============================================="

          if [ -d output ]; then
            find output -maxdepth 1 -type f -printf "%f\n" | sort
          else
            echo "No output directory."
          fi


      # ======================================================
      # FINAL STATUS
      # ======================================================

      - name: Extraction Complete
        if: success()
        env:
          CHAIN: ${{ inputs.chain }}
          START_BLOCK: ${{ inputs.start_block }}
          END_BLOCK: ${{ inputs.end_block }}
        run: |
          echo "=============================================="
          echo "EXTRACTION COMPLETE"
          echo "=============================================="
          echo "Chain       : $CHAIN"
          echo "Start Block : $START_BLOCK"
          echo "End Block   : $END_BLOCK"
          echo "Release     : $RELEASE_TAG"
          echo "=============================================="
```
