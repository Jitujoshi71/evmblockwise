name: EVM Block Range Address Extractor

on:
  workflow_dispatch:
    inputs:
      chain:
        description: "Select EVM Chain"
        required: true
        type: choice
        default: bnb
        options:
          - bnb
          - ethereum
          - polygon
          - arbitrum
          - base
          - optimism
          - avalanche_c

      start_block:
        description: "Start Block Number"
        required: true
        type: string
        default: "0"

      end_block:
        description: "End Block Number"
        required: true
        type: string
        default: "5000000"

jobs:
  extract:
    name: Extract EVM Addresses
    runs-on: ubuntu-latest
    timeout-minutes: 350

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Validate Input
        env:
          CHAIN: ${{ inputs.chain }}
          START_BLOCK: ${{ inputs.start_block }}
          END_BLOCK: ${{ inputs.end_block }}
        run: |
          set -e

          echo "=============================================="
          echo "EVM BLOCK RANGE EXTRACTOR"
          echo "=============================================="
          echo "Chain       : $CHAIN"
          echo "Start Block : $START_BLOCK"
          echo "End Block   : $END_BLOCK"
          echo "=============================================="

          if ! [[ "$START_BLOCK" =~ ^[0-9]+$ ]]; then
            echo "ERROR: Start block must be a number."
            exit 1
          fi

          if ! [[ "$END_BLOCK" =~ ^[0-9]+$ ]]; then
            echo "ERROR: End block must be a number."
            exit 1
          fi

          if [ "$START_BLOCK" -gt "$END_BLOCK" ]; then
            echo "ERROR: Start block cannot be greater than end block."
            exit 1
          fi

          TOTAL=$((END_BLOCK - START_BLOCK + 1))

          echo "Total blocks: $TOTAL"

      - name: Build
        run: |
          cargo build --release

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHAIN: ${{ inputs.chain }}
          START_BLOCK: ${{ inputs.start_block }}
          END_BLOCK: ${{ inputs.end_block }}
        run: |
          set -e

          TAG="extract-${CHAIN}-${START_BLOCK}-${END_BLOCK}-$(date +%s)"

          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"

          gh release create "$TAG" \
            --title "${CHAIN} blocks ${START_BLOCK}-${END_BLOCK}" \
            --notes "Address extraction for ${CHAIN}, blocks ${START_BLOCK} to ${END_BLOCK}."

      - name: Run Extractor
        env:
          TARGET_CHAIN: ${{ inputs.chain }}
          START_BLOCK: ${{ inputs.start_block }}
          END_BLOCK: ${{ inputs.end_block }}
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
          RPC_URL: ${{ secrets.RPC_URL }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e

          ./target/release/evm-address-extractor \
            --chain "$TARGET_CHAIN" \
            --start-block "$START_BLOCK" \
            --end-block "$END_BLOCK"

      - name: Show Output
        if: always()
        run: |
          echo "=============================================="
          echo "OUTPUT"
          echo "=============================================="

          if [ -d output ]; then
            ls -lah output/
          else
            echo "No output directory found."
          fi
