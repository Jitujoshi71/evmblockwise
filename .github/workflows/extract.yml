name: EVM Block Range Address Extractor

on:
  workflow_dispatch:
    inputs:

      chain:
        description: "Select EVM Chain"
        required: true
        default: "bnb"
        type: choice
        options:
          - bnb
          - ethereum
          - polygon
          - arbitrum
          - base
          - optimism
          - avalanche_c

      start_block:
        description: "Start Block"
        required: true
        default: "0"
        type: string

      end_block:
        description: "End Block"
        required: true
        default: "100000"
        type: string

      batch_size:
        description: "Blocks per RPC batch"
        required: true
        default: "5"
        type: string

      concurrency:
        description: "Concurrent batches"
        required: true
        default: "4"
        type: string


jobs:

  extract:

    runs-on: ubuntu-latest

    timeout-minutes: 350

    permissions:
      contents: write

    env:
      CHAIN: ${{ inputs.chain }}
      START_BLOCK: ${{ inputs.start_block }}
      END_BLOCK: ${{ inputs.end_block }}
      BATCH_SIZE: ${{ inputs.batch_size }}
      CONCURRENCY: ${{ inputs.concurrency }}

    steps:

      # ======================================================
      # CHECKOUT
      # ======================================================

      - name: Checkout Repository
        uses: actions/checkout@v4


      # ======================================================
      # RUST
      # ======================================================

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable


      # ======================================================
      # CACHE
      # ======================================================

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2


      # ======================================================
      # GITHUB CLI
      # ======================================================

      - name: Check GitHub CLI
        run: |
          gh --version


      # ======================================================
      # VALIDATE INPUT
      # ======================================================

      - name: Validate Inputs
        shell: bash
        run: |

          set -e

          echo "=============================================="
          echo "INPUT VALIDATION"
          echo "=============================================="

          echo "Chain       : $CHAIN"
          echo "Start Block : $START_BLOCK"
          echo "End Block   : $END_BLOCK"
          echo "Batch Size  : $BATCH_SIZE"
          echo "Concurrency : $CONCURRENCY"

          if ! [[ "$START_BLOCK" =~ ^[0-9]+$ ]]; then
            echo "ERROR: Start block must be numeric."
            exit 1
          fi

          if ! [[ "$END_BLOCK" =~ ^[0-9]+$ ]]; then
            echo "ERROR: End block must be numeric."
            exit 1
          fi

          if ! [[ "$BATCH_SIZE" =~ ^[0-9]+$ ]]; then
            echo "ERROR: Batch size must be numeric."
            exit 1
          fi

          if ! [[ "$CONCURRENCY" =~ ^[0-9]+$ ]]; then
            echo "ERROR: Concurrency must be numeric."
            exit 1
          fi

          if [ "$START_BLOCK" -gt "$END_BLOCK" ]; then
            echo "ERROR: Start block cannot be greater than end block."
            exit 1
          fi

          if [ "$BATCH_SIZE" -lt 1 ]; then
            echo "ERROR: Batch size must be >= 1."
            exit 1
          fi

          if [ "$CONCURRENCY" -lt 1 ]; then
            echo "ERROR: Concurrency must be >= 1."
            exit 1
          fi

          echo ""
          echo "Validation successful."


      # ======================================================
      # BUILD
      # ======================================================

      - name: Build Rust Extractor
        run: |
          cargo build --release


      # ======================================================
      # CREATE RELEASE
      # ======================================================

      - name: Create GitHub Release
        id: create_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

        shell: bash

        run: |

          set -e

          TAG="extract-${CHAIN}-${START_BLOCK}-${END_BLOCK}-$(date +%s)"

          echo "Creating release:"
          echo "$TAG"

          gh release create "$TAG" \
            --title "${CHAIN}: blocks ${START_BLOCK}-${END_BLOCK}" \
            --notes "Address extraction for ${CHAIN}, blocks ${START_BLOCK}-${END_BLOCK}."

          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"


      # ======================================================
      # RUN EXTRACTOR
      # ======================================================

      - name: Run Block Extraction
        env:
          RELEASE_TAG: ${{ env.RELEASE_TAG }}

        run: |

          set -e

          echo "=============================================="
          echo "STARTING EVM BLOCK EXTRACTION"
          echo "=============================================="

          echo "Chain       : $CHAIN"
          echo "Start Block : $START_BLOCK"
          echo "End Block   : $END_BLOCK"
          echo "Batch Size  : $BATCH_SIZE"
          echo "Concurrency : $CONCURRENCY"
          echo "Release     : $RELEASE_TAG"

          echo ""

          cargo run --release -- \
            --chain "$CHAIN" \
            --start-block "$START_BLOCK" \
            --end-block "$END_BLOCK" \
            --batch-size "$BATCH_SIZE" \
            --concurrency "$CONCURRENCY"


      # ======================================================
      # SHOW FILES
      # ======================================================

      - name: Show Generated Files
        if: always()

        shell: bash

        run: |

          echo "=============================================="
          echo "GENERATED FILES"
          echo "=============================================="

          if [ -d output ]; then

            find output \
              -type f \
              -printf "%p %s bytes\n" \
              | sort

          else

            echo "No output directory."

          fi


      # ======================================================
      # UPLOAD REMAINING FILES
      # ======================================================

      - name: Upload Remaining Files
        if: always()

        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ env.RELEASE_TAG }}

        shell: bash

        run: |

          set -e

          if [ -z "$RELEASE_TAG" ]; then
            echo "No release tag."
            exit 0
          fi

          if [ ! -d output ]; then
            echo "No output directory."
            exit 0
          fi

          shopt -s nullglob

          files=(output/*)

          if [ ${#files[@]} -eq 0 ]; then
            echo "No remaining files."
            exit 0
          fi

          for file in "${files[@]}"; do

            if [ -f "$file" ]; then

              echo "Uploading remaining file:"
              echo "$file"

              gh release upload \
                "$RELEASE_TAG" \
                "$file" \
                --clobber

            fi

          done


      # ======================================================
      # FINAL
      # ======================================================

      - name: Final Status
        if: always()

        shell: bash

        run: |

          echo ""
          echo "=============================================="
          echo "JOB FINISHED"
          echo "=============================================="

          echo "Chain       : $CHAIN"
          echo "Start Block : $START_BLOCK"
          echo "End Block   : $END_BLOCK"
          echo "Release     : $RELEASE_TAG"

          if [ -d output ]; then

            echo ""
            echo "Output directory:"
            ls -lah output

          fi
