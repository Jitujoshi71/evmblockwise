name: EVM Blockwise Extractor

on:
  workflow_dispatch:

    inputs:

      chain:
        description: "Blockchain"
        required: true
        default: "bnb"

      start_block:
        description: "Start block"
        required: true
        default: "70000"

      end_block:
        description: "End block"
        required: true
        default: "70100"

      batch_size:
        description: "RPC batch size"
        required: true
        default: "5"

      concurrency:
        description: "Concurrent batches"
        required: true
        default: "4"

      release_tag:
        description: "GitHub Release tag"
        required: true
        default: "extract-bnb-70000-70100"


# ============================================================
# GITHUB PERMISSION
# ============================================================

permissions:
  contents: write


# ============================================================
# JOB
# ============================================================

jobs:

  extract:

    runs-on: ubuntu-latest

    env:

      # IMPORTANT:
      # Required for:
      # gh release upload
      #
      GH_TOKEN: ${{ github.token }}

      CHAIN: ${{ inputs.chain }}

      START_BLOCK: ${{ inputs.start_block }}

      END_BLOCK: ${{ inputs.end_block }}

      BATCH_SIZE: ${{ inputs.batch_size }}

      CONCURRENCY: ${{ inputs.concurrency }}

      RELEASE_TAG: ${{ inputs.release_tag }}

      CARGO_TERM_COLOR: always

      RUST_BACKTRACE: 1


    steps:

      # ======================================================
      # CHECKOUT
      # ======================================================

      - name: Checkout repository

        uses: actions/checkout@v5


      # ======================================================
      # RUST
      # ======================================================

      - name: Install Rust

        uses: dtolnay/rust-toolchain@stable


      # ======================================================
      # GITHUB CLI
      # ======================================================

      - name: Check GitHub CLI

        run: |

          echo "=============================================="
          echo "GITHUB CLI"
          echo "=============================================="

          gh --version

          echo ""
          echo "Checking GitHub authentication..."

          gh auth status


      # ======================================================
      # BUILD
      # ======================================================

      - name: Build extractor

        run: |

          echo "=============================================="
          echo "BUILDING EVM BLOCKWISE EXTRACTOR"
          echo "=============================================="

          cargo build --release

          echo ""
          echo "Build completed successfully."

          ls -lh target/release/evm-blockwise


      # ======================================================
      # RUN
      # ======================================================

      - name: Run extractor

        run: |

          set -e

          echo ""
          echo "======================================================="
          echo "        EVM BLOCKWISE ADDRESS EXTRACTOR v2.4"
          echo "======================================================="
          echo ""

          echo "Chain       : ${CHAIN}"
          echo "Start Block : ${START_BLOCK}"
          echo "End Block   : ${END_BLOCK}"
          echo "Batch Size  : ${BATCH_SIZE}"
          echo "Concurrency : ${CONCURRENCY}"
          echo ""
          echo "RPC rotation: every 20,000 blocks"
          echo "RPC wait    : 10 seconds"
          echo ""
          echo "======================================================="

          ./target/release/evm-blockwise \
            --chain "${CHAIN}" \
            --start-block "${START_BLOCK}" \
            --end-block "${END_BLOCK}" \
            --batch-size "${BATCH_SIZE}" \
            --concurrency "${CONCURRENCY}"


      # ======================================================
      # SHOW GENERATED FILES
      # ======================================================

      - name: Generated files

        if: always()

        run: |

          echo ""
          echo "=============================================="
          echo "GENERATED FILES"
          echo "=============================================="

          if [ -d output ]; then

            find output \
              -maxdepth 1 \
              -type f \
              -printf "%f %s bytes\n"

          else

            echo "No output directory."

          fi


      # ======================================================
      # DISK STATUS
      # ======================================================

      - name: Disk status

        if: always()

        run: |

          echo ""
          echo "=============================================="
          echo "DISK STATUS"
          echo "=============================================="

          df -h


      # ======================================================
      # MEMORY STATUS
      # ======================================================

      - name: Memory status

        if: always()

        run: |

          echo ""
          echo "=============================================="
          echo "MEMORY STATUS"
          echo "=============================================="

          free -h
