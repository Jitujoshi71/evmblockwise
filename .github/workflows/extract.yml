name: EVM Blockwise Extractor

on:
  workflow_dispatch:
    inputs:
      chain:
        description: "Blockchain"
        required: true
        default: "bnb"
        type: choice
        options:
          - bnb
          - ethereum
          - polygon
          - arbitrum
          - base
          - optimism
          - avalanche_c

      start_block:
        description: "Start block"
        required: true
        default: "70000"

      end_block:
        description: "End block"
        required: true
        default: "70100"

      batch_size:
        description: "Blocks per RPC batch"
        required: true
        default: "5"

      concurrency:
        description: "Concurrent batches"
        required: true
        default: "4"

      release_tag:
        description: "GitHub Release tag"
        required: true
        default: "extract-bnb-70000-70100"

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    env:
      GH_TOKEN: ${{ github.token }}

    steps:

      # ======================================================
      # CHECKOUT
      # ======================================================

      - name: Checkout
        uses: actions/checkout@v4

      # ======================================================
      # RUST
      # ======================================================

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # ======================================================
      # CACHE
      # ======================================================

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      # ======================================================
      # CREATE RELEASE
      # ======================================================

      - name: Create GitHub Release
        shell: bash
        run: |
          set -e

          TAG="${{ inputs.release_tag }}"

          echo "=============================================="
          echo "CREATING / CHECKING GITHUB RELEASE"
          echo "=============================================="
          echo "Tag: $TAG"
          echo "=============================================="

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release already exists."
          else
            echo "Creating release..."
            gh release create "$TAG" \
              --title "$TAG" \
              --notes "EVM blockwise address extraction"
          fi

      # ======================================================
      # BUILD
      # ======================================================

      - name: Build
        run: |
          cargo build --release

      # ======================================================
      # SHOW CONFIG
      # ======================================================

      - name: Show Configuration
        shell: bash
        run: |
          echo "=============================================="
          echo "EXTRACTION CONFIGURATION"
          echo "=============================================="
          echo "Chain       : ${{ inputs.chain }}"
          echo "Start Block : ${{ inputs.start_block }}"
          echo "End Block   : ${{ inputs.end_block }}"
          echo "Batch Size  : ${{ inputs.batch_size }}"
          echo "Concurrency : ${{ inputs.concurrency }}"
          echo "Release     : ${{ inputs.release_tag }}"
          echo "=============================================="

      # ======================================================
      # RUN EXTRACTOR
      # ======================================================

      - name: Run Extractor
        shell: bash
        env:
          CHAIN: ${{ inputs.chain }}
          START_BLOCK: ${{ inputs.start_block }}
          END_BLOCK: ${{ inputs.end_block }}
          BATCH_SIZE: ${{ inputs.batch_size }}
          CONCURRENCY: ${{ inputs.concurrency }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          ./target/release/evm-blockwise \
            --chain "$CHAIN" \
            --start-block "$START_BLOCK" \
            --end-block "$END_BLOCK" \
            --batch-size "$BATCH_SIZE" \
            --concurrency "$CONCURRENCY"

      # ======================================================
      # SHOW GENERATED FILES
      # ======================================================

      - name: Show Generated Files
        if: always()
        shell: bash
        run: |
          echo "=============================================="
          echo "GENERATED FILES"
          echo "=============================================="

          if [ -d output ]; then
            find output -type f -maxdepth 2 -print -exec ls -lh {} \;
          else
            echo "No output directory."
          fi
