name: EVM Blockwise Extractor

on:
  workflow_dispatch:
    inputs:
      chain:
        description: "Blockchain"
        required: true
        default: "bnb"

      start_block:
        description: "Start block"
        required: true
        default: "70000"

      end_block:
        description: "End block"
        required: true
        default: "70100"

      batch_size:
        description: "Blocks per RPC batch"
        required: true
        default: "5"

      concurrency:
        description: "Concurrent batches"
        required: true
        default: "4"

jobs:
  extract:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    env:
      CHAIN: ${{ inputs.chain }}
      START_BLOCK: ${{ inputs.start_block }}
      END_BLOCK: ${{ inputs.end_block }}
      BATCH_SIZE: ${{ inputs.batch_size }}
      CONCURRENCY: ${{ inputs.concurrency }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install GitHub CLI
        run: |
          gh --version

      - name: Create Release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="extract-${CHAIN}-${START_BLOCK}-${END_BLOCK}"

          echo "TAG=$TAG" >> "$GITHUB_ENV"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release already exists: $TAG"
          else
            gh release create "$TAG" \
              --title "$TAG" \
              --notes "Blockwise extraction: ${CHAIN} ${START_BLOCK}-${END_BLOCK}"
          fi

      - name: Build
        run: |
          cargo build --release

      - name: Run extractor
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ env.TAG }}
        run: |
          set -e

          ./target/release/evm-blockwise \
            --chain "$CHAIN" \
            --start-block "$START_BLOCK" \
            --end-block "$END_BLOCK" \
            --batch-size "$BATCH_SIZE" \
            --concurrency "$CONCURRENCY"

      - name: Generated files
        if: always()
        run: |
          echo "=============================================="
          echo "GENERATED FILES"
          echo "=============================================="

          if [ -d output ]; then
            find output -type f -maxdepth 2 -print
          else
            echo "No output directory."
          fi
